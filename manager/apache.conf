<VirtualHost *:80>
ServerName localhost
DocumentRoot /var/www/html
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>
<Directory /var/www/html/img>
    <FilesMatch "(?i)\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
RewriteEngine On
RewriteRule ^/setup/?$ /index.php [END]
RewriteRule ^/recuperar/?$ /index.php [END]
ErrorLog /proc/self/fd/2
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" streamvideo
CustomLog /proc/self/fd/1 streamvideo
</VirtualHost>
