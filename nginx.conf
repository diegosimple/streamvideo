load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;
user www-data;
worker_processes 1;
events {
    worker_connections 1024;
}
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        application live {
            live on;
            record all;
            record_path /videos;
            record_unique on;
            record_suffix _%Y-%m-%d_%H-%M-%S.flv;
            exec_record_done /usr/local/bin/convert-recording $path;
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3;
            hls_playlist_length 60;
        }
    }
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server {
        listen 80;
        client_max_body_size 510m;
        location ~ ^/(|setup/?|recuperar/?|index\.php|access\.css|img/(imgLogo\.png|icone-erp\.ico))$ {
            resolver 127.0.0.11 valid=30s;
            set $manager_backend video-manager:80;
            proxy_pass http://$manager_backend$request_uri;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            proxy_request_buffering off;
            proxy_hide_header X-Powered-By;
        }
        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache always;
            add_header Access-Control-Allow-Origin * always;
        }
        location ~ ^/(embed|media)\.php$ {
            resolver 127.0.0.11 valid=30s;
            set $manager_backend video-manager:80;
            proxy_pass http://$manager_backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header X-Powered-By;
            access_log off;
        }
        location /protected-videos/ {
            internal;
            access_log off;
            alias /videos/;
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            disable_symlinks on;
        }
        location / { return 404; }
    }
}
